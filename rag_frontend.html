<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库 RAG 问答</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
    .rag-container { max-width: 800px; width: 100%; margin: 0 auto; }
    .rag-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 20px; border-radius: 12px 12px 0 0; }
    .rag-header h2 { margin: 0 0 8px 0; font-size: 22px; }
    .rag-header p { margin: 0; opacity: 0.9; font-size: 14px; }
    .rag-body { border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 12px 12px; padding: 20px; background: #fafafa; }
    .rag-input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .rag-input { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .rag-input:focus { border-color: #667eea; }
    .rag-btn { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; transition: background 0.2s; }
    .rag-btn:hover { background: #5a6fd6; }
    .rag-btn:disabled { background: #ccc; cursor: not-allowed; }
    .rag-chat { max-height: 500px; overflow-y: auto; padding: 4px; }
    .rag-msg { margin-bottom: 16px; }
    .rag-msg.user { text-align: right; }
    .rag-msg.user .bubble { background: #667eea; color: white; display: inline-block; padding: 10px 16px; border-radius: 16px 16px 4px 16px; max-width: 70%; text-align: left; }
    .rag-msg.assistant { text-align: left; }
    .rag-msg.assistant .bubble { background: white; border: 1px solid #e0e0e0; display: inline-block; padding: 10px 16px; border-radius: 16px 16px 16px 4px; max-width: 85%; text-align: left; }
    .rag-result { margin-top: 8px; padding: 10px 12px; background: #f0f4ff; border-left: 3px solid #667eea; border-radius: 4px; font-size: 13px; line-height: 1.5; }
    .rag-citation { color: #666; font-size: 12px; margin-top: 4px; }
    .rag-citation strong { color: #667eea; }
    .rag-thinking { background: #fff3e0; border-left: 3px solid #ff9800; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
    .rag-tool-call { background: #e8f5e9; border-left: 3px solid #4caf50; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 2px 0; }
    .rag-error { color: #d32f2f; font-size: 13px; }
    .rag-status-bar { display: flex; gap: 8px; padding: 8px 0; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="rag-container">
    <div class="rag-header">
        <h2>🏢 企业知识库 RAG 问答</h2>
        <p>输入问题，AI 将检索公司内部知识库并生成带引用来源的回答</p>
    </div>
    <div class="rag-body">
        <div class="rag-input-row">
            <input type="text" id="ragQuestion" class="rag-input" placeholder="例如：公司的 AI 战略是什么？" />
            <button id="ragSend" class="rag-btn" onclick="sendQuestion()">发送</button>
            <button id="ragClear" class="rag-btn" style="background:#888" onclick="clearChat()">清空</button>
        </div>
        <div class="rag-status-bar">
            <span>🔗 API: localhost:8080</span>
            <span>|</span>
            <span>📚 知识库: 10 条文档</span>
        </div>
        <div id="ragChat" class="rag-chat"></div>
    </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';

async function sendQuestion() {
    const input = document.getElementById('ragQuestion');
    const btn = document.getElementById('ragSend');
    const chat = document.getElementById('ragChat');
    const question = input.value.trim();
    if (!question) return;
    
    chat.innerHTML += '<div class="rag-msg user"><div class="bubble">' + escapeHtml(question) + '</div></div>';
    input.value = '';
    btn.disabled = true;
    
    const thinkingId = 'thinking_' + Date.now();
    chat.innerHTML += '<div class="rag-msg assistant"><div class="bubble"><div id="' + thinkingId + '" class="rag-thinking">🤔 正在分析问题，检索知识库...</div></div></div>';
    chat.scrollTop = chat.scrollHeight;
    
    try {
        const response = await fetch(API_BASE + '/api/rag/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: question, top_k: 3, min_score: 0.3, include_citations: true})
        });
        if (!response.ok) {
            throw new Error('HTTP ' + response.status + ': ' + response.statusText);
        }
        const data = await response.json();
        
        const thinking = document.getElementById(thinkingId);
        if (thinking) {
            let html = '✅ 检索到 ' + data.total + ' 条相关文档<br>';
            data.results.forEach(function(r, i) {
                html += '<div class="rag-tool-call">🔧 检索结果 ' + (i+1) + ' (相关度: ' + (r.score*100).toFixed(1) + '%)</div>';
            });
            thinking.outerHTML = html;
        }
        
        let answerHtml = '<div class="bubble">';
        if (data.results.length > 0) {
            answerHtml += '<p style="margin-bottom:8px">根据企业内部知识库检索结果：</p>';
            data.results.forEach(function(r) {
                answerHtml += '<div class="rag-result">' + escapeHtml(r.content) + '</div>';
                answerHtml += '<div class="rag-citation">📎 来源: <strong>' + escapeHtml(r.source) + '</strong>';
                if (r.page) answerHtml += ' (第 ' + r.page + ' 页)';
                answerHtml += ' | 相关度: ' + (r.score*100).toFixed(1) + '%</div>';
            });
            answerHtml += '<p style="margin-top:10px;color:#666;font-size:12px">💡 以上为知识库检索结果，AI 回答基于这些信息生成。</p>';
        } else {
            answerHtml += '<p>未在知识库中找到相关信息。建议换个关键词试试，或联系相关部门获取最新资料。</p>';
        }
        answerHtml += '</div>';
        chat.innerHTML += '<div class="rag-msg assistant">' + answerHtml + '</div>';
    } catch (e) {
        const thinking = document.getElementById(thinkingId);
        if (thinking) {
            thinking.outerHTML = '<div class="rag-error">❌ 请求失败: ' + escapeHtml(e.message) + '</div>';
        }
    }
    
    btn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
    document.getElementById('ragChat').innerHTML = '';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('ragQuestion').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendQuestion();
});
</script>
</body>
</html>
